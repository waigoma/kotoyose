name: public ci

# CI for the public repository (waigoma/kotoyose), on GitHub-hosted runners, which are free for
# public repositories. The private repository runs ci.yml on its self-hosted runner instead, and
# ci.yml is never exported. Every job here is skipped in the private repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ahs_execution_test_identity
          POSTGRES_USER: ahs_identity_ci
          POSTGRES_PASSWORD: isolated-identity-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ahs_identity_ci -d ahs_execution_test_identity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Console JavaScript syntax
        run: find src/kotoyose/static/console/js -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Rust toolchain (tests build the child app)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync
        run: uv sync --locked --extra dev --extra antigravity --extra s3
      - name: Tests
        env:
          KOTOYOSE_RUNTIME_IDENTITY_TEST_DATABASE_URL: postgresql://ahs_identity_ci:isolated-identity-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ahs_execution_test_identity
          KOTOYOSE_EXECUTION_TEST_DATABASE_URL: postgresql://ahs_identity_ci:isolated-identity-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ahs_execution_test_identity
          KOTOYOSE_EXECUTION_SERVICE_TEST_DATABASE_URL: postgresql://ahs_identity_ci:isolated-identity-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ahs_execution_test_identity
        run: uv run --no-sync pytest
      - name: Ruff
        run: uv run --no-sync ruff check src tests

  rust:
    # child の常駐アプリ (child-app/、Rust)。Windows 向けの code も cargo check で型と cfg を確かめる。
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: child-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect installer inputs changed by the PR
        id: installer
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- . ../.github/workflows/public-ci.yml ../.github/workflows/github-release.yml \
              ../scripts/build-child-installer.sh ../scripts/test-child-installer-wine.sh \
              ../pyproject.toml ../uv.lock ../src/ ../LICENSE; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-gnu
      - name: MinGW and NSIS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis gcc-mingw-w64-x86-64 python3-venv
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Kotoyose Python (the app validates provider declarations with it)
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked
          echo "KOTOYOSE_CHILD_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Windows check
        run: cargo check --locked --target x86_64-pc-windows-gnu
      - name: Build Windows installer
        if: steps.installer.outputs.build == 'true'
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/child-build-venv"
          source "$RUNNER_TEMP/child-build-venv/bin/activate"
          python -m pip install --disable-pip-version-check uv
          scripts/build-child-installer.sh
          scripts/test-child-installer-wine.sh dist/KotoyoseChild-Setup-*.exe
      - name: Audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit
