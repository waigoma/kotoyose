# Python プロジェクトの設定ファイル。
# pip や uv が「このプロジェクトは何に依存しているか」を知るために読む。
[project]
name = "kotoyose"
version = "1.1.0"
license = "Apache-2.0"
description = "Claude Agent SDK を OpenAI 互換 API でラップする最小実装"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "claude-agent-sdk==0.2.185",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "asyncpg>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "h11>=0.16",
    "jsonschema>=4.26.0",
    "mcp==1.27.0",
    "cursor-sdk==1.3.1",
    "openai-codex==0.170.0",
    "cryptography>=46.0",
]

[project.optional-dependencies]
antigravity = ["google-antigravity==0.1.23"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
]
s3 = [
    "boto3>=1.35.99",
]

[project.scripts]
kotoyose-native-claude = "kotoyose.provider_jail:main"
kotoyose-native-codex = "kotoyose.codex_provider_jail:main"
kotoyose-remote-worker = "kotoyose.remote_worker_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotoyose"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
# gate `lint` の規則。構文エラー・未定義名・比較の誤用など、実行時に必ず壊れる
# 種類だけを選ぶ。既存コードは 2026-09-15 時点でこの集合を満たしており、
# style 系 (E, W) や未使用 import (F401) は 87 件あるため段階的に広げる。
select = ["E9", "F63", "F7", "F82"]

