<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Kotoyose Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="/admin/login/console.css?v=__CONSOLE_VERSION__">
</head>
<body>
<main class="login-page">
  <section class="card login-card" aria-labelledby="login-title">
    <div class="card-head">
      <div class="login-brand">
        <span class="brand-ring" aria-hidden="true"></span>
        <span>Kotoyose</span>
      </div>
    </div>
    <div class="card-body">
      <h1 id="login-title" class="login-title">Sign in</h1>
      __NOTICE__
      __ERROR__
      <form method="post" action="/admin/login" class="form">
        <input type="hidden" name="next" value="__NEXT__">
        <label class="field">
          <span class="field-label">Username</span>
          <input class="input" type="text" name="username" autocomplete="username" value="__USERNAME__" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary login-submit">Sign in</button>
      </form>
    </div>
  </section>
</main>
<script>
// The URL fragment (#/providers) never reaches the server, so carry it into `next` here.
(function () {
  var field = document.querySelector('input[name="next"]');
  if (field && location.hash && field.value.indexOf("#") < 0) field.value += location.hash;
})();
</script>
</body>
</html>
