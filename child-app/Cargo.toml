[package]
default-run = "kotoyose-child-app"
name = "kotoyose-child-app"
version = "1.4.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64 = "0.23"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4.3"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2.6.1"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "process", "io-util", "fs", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
x509-parser = "0.18"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
tar = { version = "0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes",
    "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry",
    "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
